[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Arc targets the Osaka hard fork (https://docs.arc.io/build/evm-differences).
# solc 0.8.31+ supports Osaka.
solc_version = "0.8.34"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
