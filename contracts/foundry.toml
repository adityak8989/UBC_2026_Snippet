[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Cancun is supported by OpenZeppelin 5.x. Confirm Arc testnet supports it before deploying (Tuesday).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
